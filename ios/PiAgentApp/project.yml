# XcodeGen spec. Install: brew install xcodegen
# Generate project:  cd ios/PiAgentApp && xcodegen generate && open PiAgentApp.xcodeproj
name: PiAgentApp
options:
  bundleIdPrefix: ${BUNDLE_ID_PREFIX}
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.0"   # release version comes from APP_VERSION via fastlane
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO   # only standard HTTPS/WS crypto -> exempt
    # Mac app via Catalyst (native AppKit app can come later).
    SUPPORTS_MACCATALYST: YES
    DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
    # Dictation permission prompts.
    INFOPLIST_KEY_NSMicrophoneUsageDescription: "Dictation uses the microphone to transcribe your speech into the message box."
    INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Speech recognition converts your dictation into text in the message box."
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}   # your 10-char Team ID
    CODE_SIGN_STYLE: Automatic
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    # All four orientations for both iPhone and iPad (iPhone landscape now works).
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIconAlt
    ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
targets:
  PiAgentApp:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        CODE_SIGN_STYLE: Automatic
